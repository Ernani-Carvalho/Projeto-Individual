<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>FirstRun | Criar conta</title>
    <link rel="icon" href="assets/logo/favicon-chama.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap">
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <img class="fundo-de-capas" src="assets/fundo/fundo-de-capas.jpg" alt="">

    <div class="cabecalho">
        <div class="coluna-central">
            <a class="logo" href="index.html"><img src="assets/logo/logo-cabecalho.png" alt="FirstRun"></a>

            <nav class="menu">
                <a href="index.html">Início</a>
                <a href="jogos.html">Jogos</a>
                <a>Sobre mim</a>
            </nav>

            <div class="menu-usuario" id="div_menu_usuario">
                <a href="login.html">Entrar</a>
                <a class="pagina-atual" href="cadastro.html">Criar conta</a>
            </div>
        </div>
    </div>

    <div class="coluna-central">
        <div class="caixa-login">
            <div class="lado-boas-vindas lado-cadastro">
                <span class="texto-acima-do-titulo">Novo por aqui?</span>
                <h2>Sua jornada começa <span class="texto-azul">no primeiro save.</span></h2>

                <div class="vantagem">
                    <img src="assets/icones/icone-perfil.png" alt="">
                    <p class="texto-suave">Um perfil com suas horas e bosses derrotados.</p>
                </div>
                <div class="vantagem">
                    <img src="assets/icones/icone-dashboard.png" alt="">
                    <p class="texto-suave">Uma dashboard só sua, com gráficos do seu progresso.</p>
                </div>
                <div class="vantagem">
                    <img src="assets/icones/icone-controle.png" alt="">
                    <p class="texto-suave">Um catálogo de indies com os bosses de cada jogo.</p>
                </div>
            </div>

            <div class="lado-formulario">
                <h1 class="titulo-secao">Criar conta</h1>

                <div class="campo">
                    <label for="ipt_nome">Nome</label>
                    <input type="text" id="ipt_nome" placeholder="Como quer ser chamado">
                </div>
                <div class="campo">
                    <label for="ipt_email">Email</label>
                    <input type="text" id="ipt_email" placeholder="seuemail@email.com">
                </div>
                <div class="campo">
                    <label for="ipt_senha">Senha</label>
                    <input type="password" id="ipt_senha" placeholder="Pelo menos 6 caracteres">
                </div>
                <div class="campo">
                    <label for="ipt_confirmar_senha">Confirmar senha</label>
                    <input type="password" id="ipt_confirmar_senha" placeholder="Digite a senha de novo">
                </div>

                <div class="mensagem-erro" id="div_mensagem_erro"></div>
                <div class="mensagem-sucesso" id="div_mensagem_sucesso"></div>

                <button class="botao" onclick="cadastrar()">Criar conta</button>
                <p class="troca-de-pagina texto-suave">Já tem conta? <a href="login.html">Entrar</a></p>
            </div>
        </div>
    </div>

    <script>
        // se tiver alguém logado, troca "Entrar" e "Criar conta" pelos links da conta
        function montarMenu() {
            if (sessionStorage.ID_USUARIO != undefined) {
                div_menu_usuario.innerHTML = `
                    <a href="registrar.html">Registrar</a>
                    <a href="perfil.html">Perfil</a>
                    <a>Dashboard</a>
                    <a onclick="limparSessao()">Sair</a>`;
            }
        }

        function cadastrar() {
            let nome = ipt_nome.value.trim();
            let email = ipt_email.value.trim().toLowerCase();
            let senha = ipt_senha.value;
            let confirmarSenha = ipt_confirmar_senha.value;

            div_mensagem_erro.innerHTML = "";
            div_mensagem_sucesso.innerHTML = "";

            // vetor com os campos: o for confere um por um, sem repetir o mesmo if
            let campos = [
                { nome: "Nome", valor: nome },
                { nome: "Email", valor: email },
                { nome: "Senha", valor: senha },
                { nome: "Confirmar senha", valor: confirmarSenha }
            ];

            for (let i = 0; i < campos.length; i++) {
                if (campos[i].valor == "") {
                    div_mensagem_erro.innerHTML = `Preencha o campo ${campos[i].nome}.`;
                    return;
                }
                // a aspa simples quebraria o INSERT que o model monta
                if (campos[i].valor.includes("'")) {
                    div_mensagem_erro.innerHTML = `O campo ${campos[i].nome} não pode ter aspas simples.`;
                    return;
                }
            }

            if (nome.length < 3) {
                div_mensagem_erro.innerHTML = "O nome precisa ter pelo menos 3 letras.";
                return;
            }
            if (email.includes("@") == false || email.includes(".") == false) {
                div_mensagem_erro.innerHTML = "Digite um email válido, com @ e ponto.";
                return;
            }
            if (senha.length < 6) {
                div_mensagem_erro.innerHTML = "A senha precisa ter pelo menos 6 caracteres.";
                return;
            }
            if (senha != confirmarSenha) {
                div_mensagem_erro.innerHTML = "As senhas não são iguais.";
                return;
            }

            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: nome,
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    div_mensagem_sucesso.innerHTML = "Conta criada! Indo para o login...";

                    setTimeout(function () {
                        window.location = "login.html";
                    }, 2000);
                } else {
                    div_mensagem_erro.innerHTML = "Não foi possível criar a conta. Esse email já pode estar cadastrado.";
                }
            }).catch(function (erro) {
                console.log(erro);
                div_mensagem_erro.innerHTML = "Não foi possível falar com o servidor.";
            });
        }
        montarMenu();
    </script>

</body>

</html>
