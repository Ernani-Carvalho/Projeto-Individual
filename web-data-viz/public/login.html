<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>FirstRun | Entrar</title>
    <link rel="icon" href="assets/logo/favicon-chama.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <img class="fundo-de-capas" src="assets/fundo/fundo-de-capas.jpg" alt="">

    <div class="cabecalho">
        <div class="coluna-central">
            <a class="logo" href="index.html"><img src="assets/logo/logo-cabecalho.png" alt="FirstRun"></a>

            <nav class="menu">
                <a href="index.html">Início</a>
                <a>Jogos</a>
                <a>Sobre mim</a>
            </nav>

            <div class="menu-usuario">
                <a class="pagina-atual" href="login.html">Entrar</a>
                <a href="cadastro.html">Criar conta</a>
            </div>
        </div>
    </div>

    <div class="area-login coluna-central">
        <div class="caixa-login">
            <div class="lado-boas-vindas">
                <img class="icone-boas-vindas" src="assets/icones/icone-controle.png" alt="">
                <span class="texto-acima-do-titulo">Bem-vindo de volta</span>
                <h2>Seu save <span class="texto-azul">está esperando.</span></h2>
                <p class="texto-suave">Entre para continuar registrando suas horas, bosses e tentativas.</p>
            </div>

            <div class="lado-formulario">
                <h1 class="titulo-secao">Entrar</h1>

                <div class="campo">
                    <label for="ipt_email">Email</label>
                    <input type="text" id="ipt_email" placeholder="seuemail@email.com">
                </div>
                <div class="campo">
                    <label for="ipt_senha">Senha</label>
                    <input type="password" id="ipt_senha" placeholder="Sua senha">
                </div>

                <div class="mensagem-erro" id="div_mensagem_erro"></div>
                <div class="mensagem-sucesso" id="div_mensagem_sucesso"></div>

                <button class="botao" onclick="entrar()">Entrar</button>
                <p class="troca-de-pagina texto-suave">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
            </div>
        </div>
    </div>

    <script>
        function entrar() {
            let email = ipt_email.value.trim().toLowerCase();
            let senha = ipt_senha.value;

            div_mensagem_erro.innerHTML = "";
            div_mensagem_sucesso.innerHTML = "";

            // vetor com os campos: o for confere um por um, sem repetir o mesmo if
            let campos = [
                { nome: "Email", valor: email },
                { nome: "Senha", valor: senha }
            ];

            for (let i = 0; i < campos.length; i++) {
                if (campos[i].valor == "") {
                    div_mensagem_erro.innerHTML = `Preencha o campo ${campos[i].nome}.`;
                    return;
                }
                // a aspa simples quebraria o SELECT que o model monta
                if (campos[i].valor.includes("'")) {
                    div_mensagem_erro.innerHTML = `O campo ${campos[i].nome} não pode ter aspas simples.`;
                    return;
                }
            }

            if (email.includes("@") == false) {
                div_mensagem_erro.innerHTML = "Digite um email válido, com @.";
                return;
            }

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;

                        div_mensagem_sucesso.innerHTML = `Olá, ${json.nome}! Entrando...`;

                        // quando a dashboard/perfil.html existir, o login passa a ir para ela
                        setTimeout(function () {
                            window.location = "index.html";
                        }, 1500);
                    });
                } else if (resposta.status == 403) {
                    resposta.text().then(texto => {
                        div_mensagem_erro.innerHTML = texto;
                    });
                } else {
                    div_mensagem_erro.innerHTML = "Não foi possível entrar. Tente de novo.";
                }
            }).catch(function (erro) {
                console.log(erro);
                div_mensagem_erro.innerHTML = "Não foi possível falar com o servidor.";
            });
        }
    </script>

</body>

</html>
