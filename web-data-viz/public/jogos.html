<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>FirstRun | Jogos</title>
    <link rel="icon" href="assets/logo/favicon-chama.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap">
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/jogos.css">
</head>

<body>

    <img class="fundo-de-capas" src="assets/fundo/fundo-de-capas.jpg" alt="">

    <div class="cabecalho">
        <div class="coluna-central">
            <a class="logo" href="index.html"><img src="assets/logo/logo-cabecalho.png" alt="FirstRun"></a>

            <nav class="menu">
                <a href="index.html">Início</a>
                <a class="pagina-atual" href="jogos.html">Jogos</a>
                <a href="sobre.html">Sobre mim</a>
            </nav>

            <div class="menu-usuario" id="div_menu_usuario">
                <a href="login.html">Entrar</a>
                <a href="cadastro.html">Criar conta</a>
            </div>
        </div>
    </div>

    <div class="bloco">
        <div class="coluna-central">
            <span class="texto-acima-do-titulo">Catálogo</span>
            <h1 class="titulo-secao">Jogos</h1>
            <p class="subtitulo">Escolha um jogo para conhecer a filosofia, quem criou e os bosses.</p>

            <div class="campo busca">
                <label for="ipt_busca">Buscar jogo</label>
                <input type="text" id="ipt_busca" placeholder="Digite o nome do jogo" oninput="mostrarJogos()">
            </div>

            <div class="lista-jogos" id="div_lista_jogos"></div>
            <p class="texto-suave" id="p_sem_resultado"></p>
        </div>
    </div>


    <script>
        // se tiver alguém logado, troca "Entrar" e "Criar conta" pelos links da conta
        function montarMenu() {
            if (sessionStorage.ID_USUARIO != undefined) {
                div_menu_usuario.innerHTML = `
                    <a href="registrar.html">Registrar</a>
                    <a href="perfil.html">Perfil</a>
                    <a>Dashboard</a>
                    <a onclick="limparSessao()">Sair</a>`;
            }
        }

        // arquivo é o nome da página (jogos/), da capa e do cenário
        let jogos = [
            { nome: "Hollow Knight", arquivo: "hollow-knight" },
            { nome: "Hollow Knight: Silksong", arquivo: "silksong" },
            { nome: "Hades", arquivo: "hades" },
            { nome: "Cuphead", arquivo: "cuphead" },
            { nome: "Celeste", arquivo: "celeste" },
            { nome: "Dead Cells", arquivo: "dead-cells" },
            { nome: "Undertale", arquivo: "undertale" },
            { nome: "Blasphemous", arquivo: "blasphemous" },
            { nome: "Ori and the Blind Forest", arquivo: "ori" },
            { nome: "Nine Sols", arquivo: "nine-sols" }
        ];

        // monta os cartões; com algo digitado na busca, só entram os jogos que têm esse texto no nome
        function mostrarJogos() {
            let busca = ipt_busca.value.trim().toLowerCase();
            let encontrados = 0;

            div_lista_jogos.innerHTML = "";
            p_sem_resultado.innerHTML = "";

            for (let i = 0; i < jogos.length; i++) {
                if (jogos[i].nome.toLowerCase().includes(busca)) {
                    encontrados++;
                    div_lista_jogos.innerHTML += `
                        <a class="cartao-jogo" href="jogos/${jogos[i].arquivo}.html">
                            <img class="cenario-do-jogo" src="assets/cenarios/${jogos[i].arquivo}.jpg" alt="">
                            <img class="capa-do-jogo" src="assets/jogos/${jogos[i].arquivo}.jpg" alt="Capa de ${jogos[i].nome}">
                            <h3>${jogos[i].nome}</h3>
                        </a>`;
                }
            }

            if (encontrados == 0) {
                p_sem_resultado.innerHTML = "Nenhum jogo encontrado com esse nome.";
            }
        }

        mostrarJogos();
        montarMenu();
    </script>

</body>

</html>
